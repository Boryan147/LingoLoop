    <style>
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }

      /* Story target vocabulary highlights */
      .story-text strong, .story-text b, .story-word-tag {
        font-weight: 700 !important;
        color: #4338ca !important; /* Indigo 700 */
        background-color: #eef2ff !important; /* Indigo 50 */
        padding: 0.15rem 0.4rem !important;
        border-radius: 0.375rem !important;
        border: 1px solid #c7d2fe !important; /* Indigo 200 */
        display: inline-block !important;
        cursor: pointer !important;
        transition: all 0.15s ease-in-out !important;
        box-decoration-break: clone !important;
        -webkit-box-decoration-break: clone !important;
        user-select: none !important;
        margin: 0.1rem 0.05rem !important;
      }
      .story-text strong:hover, .story-text b:hover, .story-word-tag:hover {
        background-color: #e0e7ff !important; /* Indigo 100 */
        border-color: #818cf8 !important; /* Indigo 400 */
        transform: translateY(-1px) !important;
        box-shadow: 0 2px 4px -1px rgba(99, 102, 241, 0.2) !important;
      }
      .story-text strong.active-story-word, .story-text b.active-story-word, .story-word-tag.active-story-word {
        background-color: #4f46e5 !important; /* Indigo 600 */
        color: #ffffff !important;
        border-color: #3730a3 !important;
        box-shadow: 0 0 0 2px #a5b4fc, 0 2px 6px rgba(79, 70, 229, 0.3) !important;
      }
    </style>
